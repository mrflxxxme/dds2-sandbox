[project]
name = "dds-mcp"
version = "0.1.0"
description = "DDS2 read-only MCP server (PostgreSQL + Redis inspection)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.metadata]
allow-direct-references = true
