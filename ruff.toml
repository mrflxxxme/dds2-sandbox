# Ruff — DDS project rules
# Docs: https://docs.astral.sh/ruff/

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern Python)
    "B",      # flake8-bugbear (common bugs)
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print (ban print())
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default arg (FastAPI Depends)
    "S101",   # assert in tests is fine
    "S104",   # binding to 0.0.0.0 (docker)
    "S106",   # hardcoded password (test fixtures)
    "RUF012", # mutable class attributes (SQLAlchemy models)
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "T20"]        # assert, hardcoded pass, print OK in tests
"backend/alembic/**/*.py" = ["E402", "I001"]      # alembic auto-generated
"backend/seeds/**/*.py" = ["T20", "S"]            # seed scripts can print
"backend/routers/auth.py" = ["S110", "E712", "RUF001"]  # Redis pass-on-error, SQLAlchemy == True, Cyrillic strings
"backend/integrations/telegram_bot.py" = ["RUF001", "RUF003"]  # Cyrillic strings in Telegram bot messages
"backend/services/ai/**/*.py" = ["RUF001", "RUF003"]  # Cyrillic strings in AI prompts
"backend/scheduler/jobs/ai_digest.py" = ["RUF001", "RUF003"]  # Cyrillic strings
"backend/main.py" = ["S110", "E402", "RUF006"]  # try-except-pass, late imports, background task ref
"backend/config.py" = ["RUF003"]  # Cyrillic chars in comments
"backend/services/planning/fact_links.py" = ["E712", "E741", "RUF001"]  # SQLAlchemy == False, short var, Cyrillic strings
"backend/services/planning/cashflow.py" = ["E712"]  # SQLAlchemy == False
"backend/services/transactions_service.py" = ["E712"]  # SQLAlchemy == False
"backend/services/funnel/sync.py" = ["SIM105", "S110", "E402"]  # try-except-pass, late import (backfill re-export)
"backend/integrations/wb_api.py" = ["RUF002", "RUF013", "SIM117"]  # Cyrillic chars, Optional style, nested with
"backend/scheduler/jobs/wb_finance.py" = ["RUF002"]  # EN dash in docstring
"backend/services/wb_finance_sync.py" = ["RUF006", "SIM118"]  # background task ref, dict.keys()
"backend/utils/telegram.py" = ["RUF001", "RUF006", "S110", "F841"]  # Cyrillic, background task, pass-on-error, unused loop var

[lint.isort]
known-first-party = ["backend"]
force-single-line = false
combine-as-imports = true

# ─── Banned APIs ──────────────────────────────────────────────────────
[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
