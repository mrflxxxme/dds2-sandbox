# Ruff — DDS project rules
# Docs: https://docs.astral.sh/ruff/

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern Python)
    "B",      # flake8-bugbear (common bugs)
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print (ban print())
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default arg (FastAPI Depends)
    "S101",   # assert in tests is fine
    "S104",   # binding to 0.0.0.0 (docker)
    "S106",   # hardcoded password (test fixtures)
    "RUF012", # mutable class attributes (SQLAlchemy models)
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "T20", "RUF001", "E402"]  # assert, hardcoded pass, print, Cyrillic, late imports (TESTING=1 env setup before app import)
"backend/alembic/**/*.py" = ["E402", "I001"]      # alembic auto-generated
"backend/seeds/**/*.py" = ["T20", "S"]            # seed scripts can print
"backend/routers/auth.py" = ["S110", "E712", "RUF001"]  # Redis pass-on-error, SQLAlchemy == True, Cyrillic strings
"backend/integrations/telegram_bot.py" = ["RUF001", "RUF003"]  # Cyrillic strings in Telegram bot messages
"backend/services/ai/**/*.py" = ["RUF001", "RUF003"]  # Cyrillic strings in AI prompts
"backend/scheduler/jobs/ai_digest.py" = ["RUF001", "RUF003"]  # Cyrillic strings
"backend/main.py" = ["S110", "E402", "RUF006"]  # try-except-pass, late imports, background task ref
"backend/config.py" = ["RUF003"]  # Cyrillic chars in comments
"backend/services/planning/fact_links.py" = ["E712", "E741", "RUF001"]  # SQLAlchemy == False, short var, Cyrillic strings
"backend/services/planning/cashflow.py" = ["E712"]  # SQLAlchemy == False
"backend/services/transactions_service.py" = ["E712"]  # SQLAlchemy == False
"backend/services/funnel/sync.py" = ["SIM105", "S110", "E402"]  # try-except-pass, late import (backfill re-export)
"backend/integrations/wb_api.py" = ["RUF002", "RUF013", "SIM117"]  # Cyrillic chars, Optional style, nested with
"backend/scheduler/jobs/wb_finance.py" = ["RUF002"]  # EN dash in docstring
"backend/services/wb_finance_sync.py" = ["RUF006", "SIM118"]  # background task ref, dict.keys()
"backend/utils/telegram.py" = ["RUF001", "RUF006", "S110", "F841"]  # Cyrillic, background task, pass-on-error, unused loop var
"backend/etl/cost_parser_helpers.py" = ["RUF001", "S110", "SIM105", "UP038"]  # Cyrillic size patterns, try-except-pass, isinstance style (from cost_parsers.py)
"backend/routers/planning.py" = ["RUF001"]  # Cyrillic strings (ЗАКАЗ direction default)
"backend/routers/projects.py" = ["RUF001"]  # Cyrillic strings in slug generation
"backend/routers/telegram_miniapp.py" = ["RUF001"]  # Cyrillic strings in TMA responses
"backend/services/telegram_service.py" = ["E712", "RUF001"]  # SQLAlchemy == False, Cyrillic strings in Telegram messages
"backend/services/planning/brand_plan.py" = ["RUF001", "S608"]  # Cyrillic strings, SQL with brand clause (parameterized)
"backend/routers/reports_wb.py" = ["B904", "RUF001", "RUF002", "RUF006", "S110", "SIM105"]  # Redis graceful degradation, Cyrillic strings, background tasks
"backend/etl/service.py" = ["E402", "E712", "RUF006"]  # late imports, SQLAlchemy == False, background task ref
"backend/etl/sync_payments.py" = ["E712", "RUF001", "RUF002", "RUF003", "S110", "SIM105"]  # SQLAlchemy == False, Cyrillic strings, try-except-pass
"backend/routers/ws.py" = ["S110"]  # WebSocket try-except-pass for disconnect
"backend/services/fx_service.py" = ["E712"]  # SQLAlchemy == True/False
"backend/services/planning/crud.py" = ["E712"]  # SQLAlchemy == False
"backend/services/planning/wb.py" = ["E712", "RUF001"]  # SQLAlchemy == False, Cyrillic strings
"backend/services/reports/queries.py" = ["E711", "E712", "SIM108"]  # SQLAlchemy is None/== False, ternary
"backend/services/refs_service.py" = ["E712"]  # SQLAlchemy == False
"backend/services/integrations_service.py" = ["E712"]  # SQLAlchemy == False
"backend/services/cost/orders.py" = ["E712", "RUF001", "RUF006", "S110", "SIM105"]  # SQLAlchemy == False, Cyrillic, background task, try-except-pass
"backend/services/cost/items.py" = ["E712", "F841"]  # SQLAlchemy == False, unused var (nom_map reassign)
"backend/services/cost/duty.py" = ["E712"]  # SQLAlchemy == False
"backend/services/planning/customs.py" = ["E712", "S112"]  # SQLAlchemy == False, try-except-continue
"backend/etl/sync_wb_payouts.py" = ["E712"]  # SQLAlchemy == False
"backend/services/cost/plan_gen.py" = ["E712", "RUF001", "RUF002"]  # SQLAlchemy == False, Cyrillic strings/docstrings
"backend/services/cost_history_service.py" = ["E712"]  # SQLAlchemy == False
"backend/services/order_geography_service.py" = ["S112"]  # try-except-continue in date parsing
"backend/services/supply_chain/vehicle_delivery.py" = ["E712"]  # SQLAlchemy == False
"backend/services/bdr_loaders.py" = ["E712"]  # SQLAlchemy == False
