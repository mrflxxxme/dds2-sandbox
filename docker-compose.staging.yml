# Staging override — use with: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# Provides:
# - Separate DB volume (pgdata_staging) for full data isolation
# - DDS_ENV=staging for conditional logic
# - All credentials from .env (не хардкодить пароли!)

services:
  db:
    volumes:
      - pgdata_staging:/var/lib/postgresql/data

  backend:
    environment:
      DDS_ENV: staging

  # Disable backup for staging
  db-backup:
    profiles:
      - disabled

volumes:
  pgdata_staging:
