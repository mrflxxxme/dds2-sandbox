services:
  db:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dds_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dds_db}
    # ports: removed — DB only accessible within Docker network
    # - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dds} -d ${POSTGRES_DB:-dds_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    # ports: removed — Redis only accessible within Docker network
    # - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-dds_redis_secret}
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    # ports: removed — MinIO only accessible within Docker network
    # - "9000:9000"
    # - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dds:dds_secret@db:5432/dds_db}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://dds:dds_secret@db:5432/dds_db}
      REDIS_URL: ${REDIS_URL:-redis://:dds_redis_secret@redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-dds-files}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    volumes:
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: ../Dockerfile.react
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

  db-backup:
    image: postgres:15
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: db
      POSTGRES_USER: ${POSTGRES_USER:-dds}
      POSTGRES_DB: ${POSTGRES_DB:-dds_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dds_secret}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_INTERVAL_HOURS: "6"
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "🕐 Backup scheduler started (every $${BACKUP_INTERVAL_HOURS}h, keep $${BACKUP_RETENTION_DAYS} days)"
        # Делаем бэкап сразу при старте
        /scripts/backup.sh
        # Далее — по расписанию
        while true; do
          sleep $${BACKUP_INTERVAL_HOURS}h
          /scripts/backup.sh
        done
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  miniodata:


networks:
  internal:
    driver: bridge
