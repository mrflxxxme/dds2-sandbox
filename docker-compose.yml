services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dds
      POSTGRES_PASSWORD: dds_secret
      POSTGRES_DB: dds_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dds"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dds:dds_secret@db:5432/dds_db
      DATABASE_URL_SYNC: postgresql://dds:dds_secret@db:5432/dds_db
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./frontend:/app/frontend

volumes:
  pgdata:
