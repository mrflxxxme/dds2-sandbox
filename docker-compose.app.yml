# DDS App Server (Production) — Backend, Frontend, Nginx, Worker, Certbot
#
# Runs on: production (130.49.150.69, 10.0.0.2 via WireGuard)
# Connects to Data server (10.0.0.1) for DB, Redis, MinIO
#
# Usage: docker compose -f docker-compose.app.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    env_file: .env
    environment:
      # Data server via WireGuard VPN
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dds}:${POSTGRES_PASSWORD:-dds_secret}@10.0.0.1:6432/dds_db?prepared_statement_cache_size=0
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-dds}:${POSTGRES_PASSWORD:-dds_secret}@10.0.0.1:5432/dds_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-dds_redis_secret}@10.0.0.1:6379/0
      MINIO_ENDPOINT: 10.0.0.1:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-dds-files}
      MINIO_SECURE: "false"
      DDS_ROLE: api
    ports:
      - "10.0.0.2:8000:8000"
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dds}:${POSTGRES_PASSWORD:-dds_secret}@10.0.0.1:6432/dds_db?prepared_statement_cache_size=0
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-dds}:${POSTGRES_PASSWORD:-dds_secret}@10.0.0.1:5432/dds_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-dds_redis_secret}@10.0.0.1:6379/0
      MINIO_ENDPOINT: 10.0.0.1:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-dds-files}
      MINIO_SECURE: "false"
      DDS_ROLE: worker
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
    entrypoint: ["./entrypoint-worker.sh"]
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--timeout-keep-alive", "120"]
    ports:
      - "10.0.0.2:8001:8000"
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: ../Dockerfile.react
    depends_on:
      - backend
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-react:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done"
    restart: unless-stopped
    networks:
      - app

volumes:
  certbot-webroot:
  certbot-certs:

networks:
  app:
    driver: bridge
