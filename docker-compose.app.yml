# DDS App Server (Production) — Backend, Frontend, Nginx, Worker, Certbot, Autoheal
#
# Runs on: production (130.49.150.69, 10.0.0.2 via WireGuard)
# Connects to Data server (10.0.0.1) for DB, Redis, MinIO
#
# Usage: docker compose -f docker-compose.app.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    env_file: .env
    environment:
      # Data server via WireGuard VPN
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@10.0.0.1:6432/dds_db?prepared_statement_cache_size=0
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@10.0.0.1:5432/dds_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@10.0.0.1:6379/0
      MINIO_ENDPOINT: 10.0.0.1:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-dds-files}
      MINIO_SECURE: "false"
      DDS_ROLE: api
      DDS_ENV: production
    ports:
      - "10.0.0.2:8000:8000"
    volumes:
      - ai_memory:/data
    deploy:
      resources:
        limits:
          # 768M было впритык: на простое ~450MB, пик распознавания счёта (растеризация
          # скан-PDF + vision) добивал до лимита → cgroup OOM-kill uvicorn → 502 клиенту
          # (3 OOM за 21.07.2026; свопа на хосте нет, host RAM 5.9G — запас есть).
          memory: 1280M
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      autoheal: "true"
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@10.0.0.1:6432/dds_db?prepared_statement_cache_size=0
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@10.0.0.1:5432/dds_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@10.0.0.1:6379/0
      MINIO_ENDPOINT: 10.0.0.1:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-dds-files}
      MINIO_SECURE: "false"
      DDS_ROLE: worker
      DDS_ENV: production
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      # Тированный авто-синк ФФ (scheduler крутится в worker, SCHEDULER_ENABLED=true
      # приходит из .env). FAST — склады с активной FF-интеграцией каждые 10 мин:
      # 5 «Газпром»/skladbot, 1 «Натали»/migfull, 2 wms/wmscelicom, 12 wms 2/
      # wmscelicom. SLOW пусто; остальные склады — DEFAULT (60 мин).
      # ВНИМАНИЕ: прод деплоится ИМЕННО этим файлом (cd-production.yml → up -d
      # docker-compose.app.yml), а не docker-compose.prod.yml — держим тут.
      # (дублируется дефолтом backend/config.py = "5,1,2,12" на случай отсутствия env)
      FULFILLMENT_SYNC_FAST_WAREHOUSE_IDS: "5,1,2,12"
      FULFILLMENT_SYNC_FAST_INTERVAL_MINUTES: "10"
      FULFILLMENT_SYNC_SLOW_WAREHOUSE_IDS: ""
      FULFILLMENT_SYNC_SLOW_INTERVAL_MINUTES: "30"
    entrypoint: ["./entrypoint-worker.sh"]
    # gunicorn-мастер, как у backend: рециркуляция по max-requests (её тут
    # набивают healthcheck'и, а не нагрузка) больше не роняет контейнер целиком
    # — scheduler переезжает в свежий воркер под graceful-timeout вместо
    # обрыва джоб на полуслове. Воркер строго ОДИН: scheduler — единственный
    # экземпляр (см. entrypoint-worker.sh).
    command: ["gunicorn", "backend.main:app",
              "--worker-class", "uvicorn_worker.UvicornWorker",
              "--workers", "1",
              "--bind", "0.0.0.0:8000",
              "--max-requests", "5000",
              "--max-requests-jitter", "500",
              "--timeout", "300",
              "--graceful-timeout", "60",
              "--keep-alive", "120",
              "--no-control-socket",
              "--access-logfile", "-",
              "--error-logfile", "-"]
    stop_grace_period: 60s
    ports:
      - "10.0.0.2:8001:8000"
    volumes:
      - ai_memory:/data
    deploy:
      resources:
        limits:
          # Ловил OOM-kill на 1024M (21.07.2026 15:30, anon-rss≈1019MB) — тот же класс
          # проблемы, что у backend; поднято с запасом.
          memory: 1280M
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,json; r=urllib.request.urlopen('http://localhost:8000/health'); d=json.loads(r.read()); exit(0 if d.get('scheduler_ok',True) else 1)" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      autoheal: "true"
    networks:
      - app

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: ../Dockerfile.react
    depends_on:
      - backend
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      autoheal: "true"
    networks:
      - app

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-react:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      autoheal: "true"
    networks:
      - app

  certbot:
    image: certbot/certbot:v3.1.0
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done"
    restart: unless-stopped
    networks:
      - app

  # Auto-restart unhealthy containers (incident 2026-04-14: backend hung 15h
  # because restart: unless-stopped only restarts exited containers, not unhealthy).
  # Triggers `docker restart` on any container with label autoheal=true.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: dds-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 300
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 32M
    restart: unless-stopped

volumes:
  certbot-webroot:
  certbot-certs:
  ai_memory:

networks:
  app:
    driver: bridge
