[databases]
; All connections to dds_db routed to PostgreSQL
dds_db = host=db port=5432 dbname=dds_db

[pgbouncer]
; ─── Connection settings ─────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; ─── Pool mode ───────────────────────────────────────────────────────────────
; transaction mode — each transaction gets a server connection, then returns it
; Compatible with SET LOCAL (RLS) since SET LOCAL is transaction-scoped
pool_mode = transaction

; ─── Pool sizing ─────────────────────────────────────────────────────────────
; 6 API workers × 20 pool_size + 1 worker × 10 pool_size = 130 max from app
; default_pool_size per (user, database) pair
default_pool_size = 40
min_pool_size = 10
max_client_conn = 500
max_db_connections = 200

; Reserve for admin connections
reserve_pool_size = 5
reserve_pool_timeout = 3

; ─── Timeouts ────────────────────────────────────────────────────────────────
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 0
query_timeout = 0
query_wait_timeout = 120

; ─── Housekeeping ────────────────────────────────────────────────────────────
; Reset server state between transactions (important for transaction pooling)
server_reset_query = DISCARD ALL

; ─── Logging ─────────────────────────────────────────────────────────────────
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; ─── Admin ───────────────────────────────────────────────────────────────────
admin_users = dds
