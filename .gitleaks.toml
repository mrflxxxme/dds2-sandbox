# Gitleaks configuration for DDS project
# Docs: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "DDS project allowlist — false positives"
regexes = [
  # Obvious test/placeholder values in tests
  "test_api_key_1234567890_long_enough_to_mask",
  # CI placeholder secrets in workflow env sections
  "dds_ci_secret",
  "dds_ci_redis",
  "ci-test-secret-key-minimum-32-chars-long",
  # Staging template placeholders
  "staging_secret_change_me",
  "staging_redis_secret",
  "staging_minio_secret",
  # Directory path in CLAUDE.md prose — generic-api-key triggers on the
  # nearby word "API"; `scheduler/jobs/` is a folder name, not a secret.
  "scheduler/jobs/",
]

paths = [
  # Claude agent worktree artifacts — not real commits
  ".claude/worktrees",
]

