# DDS Monitoring Server — Prometheus, Grafana, AlertManager, Exporters
#
# Runs on: dds-monitoring (10.0.0.3 via WireGuard)
# Scrapes metrics from App (10.0.0.2) and Data (10.0.0.1) over VPN

services:
  prometheus:
    image: prom/prometheus:v2.53.5
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
    ports:
      - "10.0.0.3:9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    depends_on:
      - alertmanager
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "10.0.0.3:9093:9093"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SERVER_ROOT_URL=https://app.vyatkin-wb.ru/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "10.0.0.3:3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-dds}:${POSTGRES_PASSWORD:-dds_secret}@10.0.0.1:5432/${POSTGRES_DB:-dds_db}?sslmode=disable"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    networks:
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: "redis://default:${REDIS_PASSWORD:-dds_redis_secret}@10.0.0.1:6379"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    networks:
      - monitoring

  # Node exporter for monitoring server host metrics (memory, disk, CPU)
  # NOTE: node_exporter must also be deployed on app (10.0.0.2:9100) and data (10.0.0.1:9100) servers
  node-exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "10.0.0.3:9100:9100"
    pid: host
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    networks:
      - monitoring

  # Pushgateway for backup age metric
  # Backup cron pushes: echo "dds_backup_last_success_timestamp $(date +%s)" | curl --data-binary @- http://10.0.0.3:9091/metrics/job/backup
  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "10.0.0.3:9091:9091"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  prometheusdata:
  grafanadata:
  alertmanagerdata:

networks:
  monitoring:
    driver: bridge
