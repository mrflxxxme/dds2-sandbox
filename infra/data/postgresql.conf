# PostgreSQL 15 — Data Server config
# Optimized for 2560MB container on shared 4GB server

# ─── Connections ──────────────────────────────────────────────────────────────
listen_addresses = '*'                # Docker network + WireGuard VPN
max_connections = 200

# ─── Memory ──────────────────────────────────────────────────────────────────
shared_buffers = 640MB                # 25% of 2560MB container limit
effective_cache_size = 2GB            # ~75% of container memory
work_mem = 8MB                        # per-operation
maintenance_work_mem = 256MB          # VACUUM, CREATE INDEX
wal_buffers = 16MB                    # WAL write buffer

# ─── WAL & Checkpoints ──────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min             # checkpoint frequency
min_wal_size = 256MB
max_wal_size = 1GB

# ─── Data Durability (NEVER change these) ────────────────────────────────────
fsync = on                            # force WAL to disk
full_page_writes = on                 # prevent partial page writes
synchronous_commit = on               # wait for WAL flush
wal_level = replica                   # enable PITR
archive_mode = on                     # enable WAL archiving
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'
wal_sync_method = fdatasync           # reliable sync method

# ─── Query Planner ───────────────────────────────────────────────────────────
random_page_cost = 1.1                # SSD-optimized
effective_io_concurrency = 200        # SSD parallel I/O

# ─── Logging ─────────────────────────────────────────────────────────────────
log_min_duration_statement = 500      # log queries > 500ms
log_line_prefix = '%t [%p] %d '
log_statement = 'none'

# ─── Locale ──────────────────────────────────────────────────────────────────
timezone = 'UTC'
