# PostgreSQL 15 — Data Server config
# Optimized for dedicated 4GB RAM server (all RAM for PostgreSQL)

# ─── Connections ──────────────────────────────────────────────────────────────
listen_addresses = '*'                # Docker network + WireGuard VPN
max_connections = 200

# ─── Memory ──────────────────────────────────────────────────────────────────
shared_buffers = 1GB                  # 25% of 4GB dedicated RAM
effective_cache_size = 3GB            # 75% of RAM
work_mem = 8MB                        # per-operation (more RAM available)
maintenance_work_mem = 512MB          # VACUUM, CREATE INDEX
wal_buffers = 16MB                    # WAL write buffer

# ─── WAL & Checkpoints ──────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 1GB

# ─── Query Planner ───────────────────────────────────────────────────────────
random_page_cost = 1.1                # SSD-optimized
effective_io_concurrency = 200        # SSD parallel I/O

# ─── Logging ─────────────────────────────────────────────────────────────────
log_min_duration_statement = 500      # log queries > 500ms
log_line_prefix = '%t [%p] %d '
log_statement = 'none'

# ─── Locale ──────────────────────────────────────────────────────────────────
timezone = 'UTC'
