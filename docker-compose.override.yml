# Local development override — auto-loaded by docker compose
# Enables hot-reload for backend and frontend via volume mounts
#
# docker compose up -d  ← автоматически подхватит этот файл
#
# НЕ коммитить изменения, специфичные для вашей машины.
# Этот файл общий для всех разработчиков.

services:
  backend:
    # Dev hot-reload: uvicorn --reload следит за смонтированным ./backend →
    # правки .py подхватываются без `docker compose restart backend`.
    # reload-dir ограничен backend/, чтобы не сканировать tests/migrations/scripts.
    # Прод (docker-compose.prod.yml) этот override НЕ подхватывает → там без --reload.
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "backend", "--timeout-keep-alive", "120"]
    volumes:
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./pytest.ini:/app/pytest.ini
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    environment:
      DDS_ENV: development
      DDS_ROLE: api
    ports:
      - "8000:8000"
    # Тесты гоняются внутри backend-контейнера (pytest -n 2 в pre-push) рядом
    # с живым uvicorn. 1024M из docker-compose.yml не хватает на 3 процесса →
    # контейнер OOM-кил/exit 137. Только локально — прод на
    # docker-compose.prod.yml этот файл не подхватывает.
    #
    # 2026-07-26: 2G стало мало. Сюита выросла до ~4700 тестов (+411 FBS), и
    # ОДИН pytest-процесс рядом с uvicorn уже занимал 1.914G из 2G (95.7%).
    # Второй xdist-воркер не влезал → OOM-кил воркера → гейт падал ВСЕГДА,
    # независимо от кода: агент не мог получить зелёное и не мог пушить.
    # Диагноз подтверждён: тот же набор тестов без `-n 2` проходит сборку до
    # конца (падают только 3 теста по своей причине, не по OOM).
    deploy:
      resources:
        limits:
          memory: 3584M

  worker:
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    environment:
      DDS_ENV: development
      DDS_ROLE: worker
      # Локалка: основной scheduler выключен (.env SCHEDULER_ENABLED=false —
      # WB/Telegram-джобам нужны живые ключи). Поднимаем FF-only scheduler с тем
      # же тирингом, что и прод, но БЕЗ DEFAULT-контура (синкаем только
      # перечисленные склады — БД локально копия прода с ~2k замаскированных
      # ключей). Прод этот override НЕ подхватывает → у него своя настройка в
      # docker-compose.prod.yml.
      FULFILLMENT_SYNC_ENABLED: "true"
      # FAST — 5 Газпром (skladbot) + 1 натали (migfull), каждые 10 мин.
      FULFILLMENT_SYNC_FAST_WAREHOUSE_IDS: "5,1"
      FULFILLMENT_SYNC_FAST_INTERVAL_MINUTES: "10"
      # SLOW — 2 wms/wmscelicom, каждые 30 мин.
      FULFILLMENT_SYNC_SLOW_WAREHOUSE_IDS: "2"
      FULFILLMENT_SYNC_SLOW_INTERVAL_MINUTES: "30"

  frontend-react:
    # Override prod build → run Next.js dev server (HMR, no rebuild required)
    entrypoint: []
    command: sh -c "npm install --legacy-peer-deps --silent && npx --no-install next dev --turbopack -p 3000"
    user: root
    working_dir: /app
    volumes:
      - ./frontend-react:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      disable: true
    restart: "no"

  # Expose DB for local tools (DBeaver, pgAdmin, etc.) — port 5433 to avoid pgbouncer conflict
  db:
    ports:
      - "5433:5432"

  # Expose PgBouncer for local debugging (port 5432)
  pgbouncer:
    ports:
      - "5432:5432"

  # Expose Redis for local debugging
  redis:
    ports:
      - "6379:6379"

volumes:
  frontend_node_modules:
  frontend_next_cache:
