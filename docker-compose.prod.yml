services:
  db:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/dds_db
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      MAX_CLIENT_CONN: 200
      MAX_DB_CONNECTIONS: 50
      SERVER_RESET_QUERY: "DISCARD ALL"
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5432" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@pgbouncer:5432/dds_db?prepared_statement_cache_size=0
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/dds_db
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-dds-files}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      DDS_ROLE: api
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@pgbouncer:5432/dds_db?prepared_statement_cache_size=0
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/dds_db
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-dds-files}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      DDS_ROLE: worker
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
    entrypoint: ["./entrypoint-worker.sh"]
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--timeout-keep-alive", "120"]
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: ../Dockerfile.react
    depends_on:
      - backend
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - frontend-react
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    networks:
      - internal

  db-backup:
    image: postgres:15
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: db
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_INTERVAL_HOURS: "6"
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "🕐 Backup scheduler started (every $${BACKUP_INTERVAL_HOURS}h, keep $${BACKUP_RETENTION_DAYS} days)"
        /scripts/backup.sh
        while true; do
          sleep $${BACKUP_INTERVAL_HOURS}h
          /scripts/backup.sh
        done
    restart: unless-stopped
    networks:
      - internal

  # ─── Monitoring ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.5
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      - GF_SERVER_ROOT_URL=https://app.vyatkin-wb.ru/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: "postgresql://dds:${POSTGRES_PASSWORD}@db:5432/dds_db?sslmode=disable"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: "redis://default:${REDIS_PASSWORD}@redis:6379"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  miniodata:
  certbot-webroot:
  prometheusdata:
  grafanadata:


networks:
  internal:
    driver: bridge
