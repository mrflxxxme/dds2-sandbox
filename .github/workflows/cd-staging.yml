# CI/CD — Deploy to Staging on push to dev
#
# Requires GitHub Secrets:
#   STAGING_HOST     — staging server IP
#   STAGING_USER     — SSH user (e.g. root)
#   STAGING_SSH_KEY  — private SSH key
#   STAGING_PATH     — path to project (e.g. /opt/dds_staging)

name: Deploy to Staging

on:
  push:
    branches: [dev]

# Only one staging deploy at a time
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.STAGING_PATH }}

            echo "📥 Pulling dev branch..."
            git pull origin dev

            echo "🔨 Building images..."
            docker compose -f docker-compose.yml \
              -f docker-compose.staging.yml \
              up -d --build backend frontend-react

            echo "🗄️ Running migrations..."
            docker compose exec -T backend alembic upgrade head

            echo "🏥 Health check..."
            sleep 10
            curl -sf http://localhost/health || { echo "❌ Health check failed!"; exit 1; }

            echo "✅ Staging deploy complete!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed! Check server logs."
