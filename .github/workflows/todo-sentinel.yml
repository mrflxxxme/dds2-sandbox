# Sentinel: ищет TODO/FIXME/HACK старше N дней → создаёт GitHub issue
# Раз в неделю (понедельник 06:00 UTC) + manual trigger
name: TODO Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Понедельник 06:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  scan-todos:
    name: Scan stale TODO/FIXME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # для git blame

      - name: Find stale TODO/FIXME (older than 30 days)
        id: scan
        run: |
          set -euo pipefail
          THRESHOLD_DAYS=30
          NOW_TS=$(date +%s)
          THRESHOLD_TS=$((NOW_TS - THRESHOLD_DAYS * 86400))

          STALE_FILE=$(mktemp)

          # Поиск только в исходниках, без node_modules / migrations / dist
          grep -rn -E '(TODO|FIXME|HACK)[: ]' \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
            --exclude-dir=migrations --exclude-dir=.venv --exclude-dir=__pycache__ \
            backend/ frontend-react/src/ 2>/dev/null | while IFS=: read -r file line content; do
              # git blame: когда добавлена эта строка (быстрее и стабильнее чем git log -L)
              ts=$(git blame --porcelain -L "${line},${line}" -- "${file}" 2>/dev/null | awk '/^author-time/ {print $2; exit}')
              if [ -n "${ts:-}" ] && [ "$ts" -gt 0 ] && [ "$ts" -lt "$THRESHOLD_TS" ]; then
                age_days=$(( (NOW_TS - ts) / 86400 ))
                # экранируем pipes в content чтобы не ломать markdown table
                safe_content=$(echo "$content" | tr '|' '/')
                echo "${age_days}d | ${file}:${line} | ${safe_content}" >> "$STALE_FILE"
              fi
            done

          STALE_COUNT=$(wc -l < "$STALE_FILE" | tr -d ' ')
          echo "stale_count=$STALE_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$STALE_COUNT" -gt 0 ]; then
            echo "## Stale TODO/FIXME (older than ${THRESHOLD_DAYS} days)" > issue_body.md
            echo "" >> issue_body.md
            echo "Total: $STALE_COUNT" >> issue_body.md
            echo "" >> issue_body.md
            echo '```' >> issue_body.md
            sort -t'|' -k1 -rn "$STALE_FILE" | head -50 >> issue_body.md
            echo '```' >> issue_body.md
            echo "" >> issue_body.md
            echo "_Generated by todo-sentinel workflow_" >> issue_body.md
          fi

      - name: Create or update issue
        if: steps.scan.outputs.stale_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('issue_body.md', 'utf8');
            const title = `[sentinel] Stale TODO/FIXME — ${new Date().toISOString().slice(0,10)}`;

            // Поиск существующего открытого issue с тем же префиксом
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sentinel,todo'
            });

            const existing = issues.find(i => i.title.startsWith('[sentinel] Stale TODO/FIXME'));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sentinel', 'todo', 'tech-debt']
              });
              console.log('Created new issue');
            }
