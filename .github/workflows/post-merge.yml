# Phase 4: post-merge actions on main
# - Smoke E2E (быстрая проверка что main работоспособен)
# - Performance check (если есть benchmark)
# - Auto-rollback issue если smoke упал
name: Post-Merge Actions

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke-e2e:
    name: Smoke E2E (post-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend deps
        working-directory: frontend-react
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E (27 страниц)
        id: smoke
        continue-on-error: true
        working-directory: frontend-react
        run: |
          set +e
          npx playwright test tests/e2e/smoke.spec.ts --reporter=line 2>&1 | tee ../smoke-output.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright report on failure
        if: steps.smoke.outputs.exit != '0'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: frontend-react/playwright-report/
          retention-days: 7

      - name: Create rollback issue if smoke failed
        if: steps.smoke.outputs.exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString();
            const sha = context.sha.substring(0, 7);
            const tail = fs.existsSync('smoke-output.txt')
              ? fs.readFileSync('smoke-output.txt', 'utf8').slice(-3000)
              : '(no output)';
            const commitMsg = (context.payload.head_commit && context.payload.head_commit.message) || '(unknown)';
            const author = (context.payload.head_commit && context.payload.head_commit.author && context.payload.head_commit.author.username) || 'unknown';
            const lines = [
              '## Post-merge smoke E2E FAILED',
              '',
              'Commit `' + sha + '` merged to main at ' + date + ' broke smoke E2E.',
              '',
              '### Last commit',
              commitMsg,
              '',
              '### Author',
              '@' + author,
              '',
              '### Smoke test tail',
              '```',
              tail,
              '```',
              '',
              '### Recommended actions',
              '1. Check Playwright report (see workflow artifacts)',
              '2. If reproducible — `git revert ' + sha + '` and push to dev → auto-PR → merge',
              '3. If flaky — re-run workflow; investigate test stability',
              '',
              '_Auto-generated by post-merge workflow_'
            ];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[post-merge] Smoke E2E FAILED on ' + sha,
              body: lines.join('\n'),
              labels: ['post-merge', 'urgent', 'sentinel']
            });

  notify-success:
    name: Mark deploy ready
    runs-on: ubuntu-latest
    needs: smoke-e2e
    if: success()
    steps:
      - name: Log success
        run: echo "✅ Smoke E2E passed on main — deploy via cd-production.yml will proceed"
