# Auto-create PR from dev to main after push
name: Auto PR

on:
  push:
    branches: [dev]

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    name: Create PR dev → main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Check for existing PR and create if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if an open PR from dev to main already exists
          EXISTING_PR=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists (dev → main), skipping creation"
            exit 0
          fi

          # Get the last commit message for the PR title
          LAST_COMMIT_MSG=$(git log -1 --format='%s')

          # Build PR body with commit summary since main
          COMMITS=$(git log origin/main..dev --oneline)
          PR_BODY="## Commits"$'\n\n'"${COMMITS}"$'\n\n'"---"$'\n'"Auto-created by CI from dev branch push."

          echo "Creating PR: ${LAST_COMMIT_MSG}"
          gh pr create \
            --base main \
            --head dev \
            --title "${LAST_COMMIT_MSG}" \
            --body "${PR_BODY}"

      - name: Enable native auto-merge
        # GH_PAT (не GITHUB_TOKEN): merge, выполненный GitHub'ом по auto-merge,
        # должен триггерить cd-production. Push от GITHUB_TOKEN не запускает
        # workflow — деплоя бы не было. auto-merge.yml остаётся fallback'ом и
        # обновляет BEHIND-ветку (native сам её не апдейтит при strict_uptodate).
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Открытый dev → main PR (только что созданный или уже существовавший)
          PR_NUMBER=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "Нет открытого dev → main PR — нечего авто-мёржить"
            exit 0
          fi
          # --auto: GitHub смёржит сам, когда required-чеки зелёные И ветка up-to-date
          echo "Включаю auto-merge на PR #${PR_NUMBER}..."
          gh pr merge "$PR_NUMBER" --auto --merge \
            || echo "⚠ auto-merge не включился (уже включён / недоступен) — auto-merge.yml fallback добьёт"
