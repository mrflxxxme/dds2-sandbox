# Sentinel: еженедельная проверка project_known_bugs.md → создание/обновление tracking issue
# (memory/project_known_bugs.md лежит локально и не commit'ится — поэтому здесь
# мы используем git grep по коду на маркеры P{N} известных багов из memory)
#
# Weekly Tue 06:00 UTC (после todo-sentinel в Mon)
name: Known Bugs Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 2'  # Вторник 06:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Scan known bug markers in code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Find P-incident markers in code
        id: scan
        run: |
          set -euo pipefail

          # Ищем комментарии типа "P25", "P-25", "see P25", "incident P25" в коде
          # (правило DDS — известные баги/инциденты помечаются P{N})
          OUT=$(mktemp)
          grep -rnE '(\bP[0-9]+\b|\bP-[0-9]+\b)' \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.md' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=migrations \
            --exclude-dir=.venv --exclude-dir=__pycache__ \
            backend/ frontend-react/src/ 2>/dev/null | head -50 > "$OUT" || true

          COUNT=$(wc -l < "$OUT" | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            {
              echo "## Known bug markers (P{N}) found in code"
              echo ""
              echo "Total references: $COUNT (top 50 shown)"
              echo ""
              echo '```'
              cat "$OUT"
              echo '```'
              echo ""
              echo "_Generated by known-bugs-sentinel. Cross-check with memory/project_known_bugs.md._"
            } > issue_body.md
          fi

      - name: Create or update issue
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('issue_body.md', 'utf8');
            const title = `[sentinel] Known bug markers — ${new Date().toISOString().slice(0,10)}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sentinel,known-bug'
            });

            const existing = issues.find(i => i.title.startsWith('[sentinel] Known bug markers'));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sentinel', 'known-bug', 'tech-debt']
              });
            }
