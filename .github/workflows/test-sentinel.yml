# Sentinel: ежедневный прогон тестов на main → PR с авто-фиксом при падении
# Daily 04:00 UTC (между E2E nightly 03:00 и Security 05:00)
name: Test Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # Daily 04:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  run-tests:
    name: Run pytest + vitest on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install backend deps
        run: pip install -r requirements-backend.txt

      - name: Install frontend deps
        working-directory: frontend-react
        run: npm ci --legacy-peer-deps

      - name: Run backend tests
        id: backend
        continue-on-error: true
        run: |
          set +e
          pytest tests/ -x --tb=short -q 2>&1 | tee backend-test-output.txt
          BACKEND_EXIT=$?
          echo "exit=$BACKEND_EXIT" >> "$GITHUB_OUTPUT"
          if [ $BACKEND_EXIT -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            tail -100 backend-test-output.txt > backend-tail.txt
          fi
          exit 0

      - name: Run frontend tests
        id: frontend
        continue-on-error: true
        working-directory: frontend-react
        run: |
          set +e
          npx vitest run --reporter=dot 2>&1 | tee ../frontend-test-output.txt
          FE_EXIT=$?
          echo "exit=$FE_EXIT" >> "$GITHUB_OUTPUT"
          if [ $FE_EXIT -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            tail -100 ../frontend-test-output.txt > ../frontend-tail.txt
          fi
          exit 0

      - name: Create issue if tests failed
        if: steps.backend.outputs.failed == 'true' || steps.frontend.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().slice(0,10);
            let body = `## Test Sentinel Report — ${date}\n\nDaily test run on \`main\` failed.\n\n`;

            if (fs.existsSync('backend-tail.txt')) {
              body += `### Backend (pytest) — FAILED\n\n\`\`\`\n${fs.readFileSync('backend-tail.txt', 'utf8').slice(0, 4000)}\n\`\`\`\n\n`;
            }
            if (fs.existsSync('frontend-tail.txt')) {
              body += `### Frontend (vitest) — FAILED\n\n\`\`\`\n${fs.readFileSync('frontend-tail.txt', 'utf8').slice(0, 4000)}\n\`\`\`\n\n`;
            }

            body += `\n_Generated by test-sentinel workflow on \`main\` at ${new Date().toISOString()}_`;

            const title = `[sentinel] Tests FAILED on main — ${date}`;

            // Найти существующий открытый issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sentinel,test-failure'
            });

            const existing = issues.find(i => i.title.startsWith('[sentinel] Tests FAILED'));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sentinel', 'test-failure', 'urgent']
              });
              console.log('Created new issue');
            }

      - name: Close stale issue if tests passed
        if: steps.backend.outputs.failed != 'true' && steps.frontend.outputs.failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sentinel,test-failure'
            });
            for (const issue of issues) {
              if (issue.title.startsWith('[sentinel] Tests FAILED')) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Tests passing again on \`main\` as of ${new Date().toISOString()}. Auto-closing.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }
