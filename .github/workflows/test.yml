# CI — Run backend tests on push/PR
name: Tests

on:
  workflow_call:
  push:
    branches: [main, dev, develop]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'migrations/**'
      - 'requirements-backend.txt'
      - 'docker-compose.yml'
      - 'docker-compose.app.yml'
      - 'Dockerfile.backend'
      - 'frontend-react/**'
      - '.github/workflows/**'
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'migrations/**'
      - 'requirements-backend.txt'
      - 'frontend-react/**'
      - 'docker-compose.yml'
      - 'docker-compose.app.yml'
      - 'Dockerfile.backend'
      - '.github/workflows/**'
      - 'infra/**'

jobs:
  conventions:
    name: Convention Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run convention checks
        run: bash scripts/check_conventions.sh

  docs-check:
    name: Documentation Checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Run documentation checks
        run: bash scripts/check_docs.sh

  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install mypy sqlalchemy[mypy]==2.0.28 pydantic==2.6.3 \
            types-redis types-pytz \
            fastapi==0.124.0 pydantic-settings==2.2.1 \
            python-jose[cryptography]==3.4.0 httpx==0.27.0 \
            asyncpg==0.29.0 redis==5.0.1

      - name: Run mypy on services/ and models/
        run: mypy backend/services/ backend/models/ --config-file pyproject.toml

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_USER: dds
      POSTGRES_PASSWORD: dds_ci_secret
      POSTGRES_DB: dds_db
      DATABASE_URL: postgresql+asyncpg://dds:dds_ci_secret@db:5432/dds_db
      DATABASE_URL_SYNC: postgresql://dds:dds_ci_secret@db:5432/dds_db
      REDIS_URL: redis://:dds_ci_redis@redis:6379/0
      REDIS_PASSWORD: dds_ci_redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dds-files
      MINIO_SECURE: "false"
      SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
      TESTING: "1"
      REGISTER_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space and add swap (prevent OOM exit code 137)
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Create .env for docker-compose
        run: |
          cat > .env <<'DOTENV'
          POSTGRES_USER=dds
          POSTGRES_PASSWORD=dds_ci_secret
          POSTGRES_DB=dds_db
          DATABASE_URL=postgresql+asyncpg://dds:dds_ci_secret@db:5432/dds_db
          DATABASE_URL_SYNC=postgresql://dds:dds_ci_secret@db:5432/dds_db
          REDIS_URL=redis://:dds_ci_redis@redis:6379/0
          REDIS_PASSWORD=dds_ci_redis
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET=dds-files
          MINIO_SECURE=false
          SECRET_KEY=ci-test-secret-key-minimum-32-chars-long
          TESTING=1
          REGISTER_ENABLED=true
          DOTENV
          # Strip leading whitespace from .env (heredoc preserves indentation)
          sed -i 's/^[[:space:]]*//' .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('requirements-backend.txt', 'Dockerfile.backend') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build backend image with cache
        run: |
          docker buildx build \
            --file Dockerfile.backend \
            --tag dds_app-backend:latest \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Start services
        run: |
          docker compose up -d db pgbouncer redis minio backend
          echo "Waiting for services to be healthy..."
          docker compose exec -T backend python -c "print('Backend is up')" 2>/dev/null || sleep 10
          for i in {1..30}; do
            if docker compose exec -T backend python -c "
              import asyncio
              from backend.database import async_engine
              async def check():
                  async with async_engine.connect() as conn:
                      await conn.execute(__import__('sqlalchemy').text('SELECT 1'))
                      print('DB connected')
              asyncio.run(check())
            " 2>/dev/null; then
              echo "Database ready"
              break
            fi
            echo "  Waiting for DB... ($i/30)"
            sleep 2
          done

      - name: Run Alembic migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Run tests with coverage
        run: |
          docker compose exec -T backend pytest tests/ -x --tb=short -q \
            --cov=backend --cov-report=xml:coverage.xml --cov-report=term

      - name: Copy coverage.xml from container
        if: always()
        run: docker compose cp backend:/app/coverage.xml ./coverage-backend.xml 2>/dev/null || true

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-backend.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Cleanup
        if: always()
        run: docker compose down -v 2>/dev/null || true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: cd frontend-react && npm ci --legacy-peer-deps || npm ci --legacy-peer-deps

      - name: Run vitest with coverage
        run: cd frontend-react && npx vitest run --coverage

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend-react/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
