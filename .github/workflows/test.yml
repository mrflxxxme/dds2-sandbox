# CI — Run backend tests on push/PR
name: Tests

on:
  workflow_call:
  push:
    branches: [main, dev, develop]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'migrations/**'
      - 'requirements-backend.txt'
      - 'docker-compose.yml'
      - 'docker-compose.app.yml'
      - 'Dockerfile.backend'
      - 'frontend-react/**'
      - '.github/workflows/**'
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'migrations/**'
      - 'requirements-backend.txt'
      - 'frontend-react/**'
      - 'docker-compose.yml'
      - 'docker-compose.app.yml'
      - 'Dockerfile.backend'
      - '.github/workflows/**'
      - 'infra/**'

jobs:
  conventions:
    name: Convention Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run convention checks
        run: bash scripts/check_conventions.sh

  docs-check:
    name: Documentation Checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: Run documentation checks
        run: bash scripts/check_docs.sh

  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install mypy sqlalchemy[mypy]==2.0.28 pydantic==2.6.3 \
            types-redis types-pytz \
            fastapi==0.124.0 pydantic-settings==2.2.1 \
            python-jose[cryptography]==3.4.0 httpx==0.27.0 \
            asyncpg==0.29.0 redis==5.0.1

      - name: Run mypy on services/ and models/
        run: mypy backend/services/ backend/models/ --config-file pyproject.toml

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_USER: dds
      POSTGRES_PASSWORD: dds_ci_secret
      POSTGRES_DB: dds_db
      DATABASE_URL: postgresql+asyncpg://dds:dds_ci_secret@db:5432/dds_db
      DATABASE_URL_SYNC: postgresql://dds:dds_ci_secret@db:5432/dds_db
      REDIS_URL: redis://:dds_ci_redis@redis:6379/0
      REDIS_PASSWORD: dds_ci_redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dds-files
      MINIO_SECURE: "false"
      SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
      TESTING: "1"
      REGISTER_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space and add swap (prevent OOM exit code 137)
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Create .env for docker-compose
        run: |
          cat > .env <<'DOTENV'
          POSTGRES_USER=dds
          POSTGRES_PASSWORD=dds_ci_secret
          POSTGRES_DB=dds_db
          DATABASE_URL=postgresql+asyncpg://dds:dds_ci_secret@db:5432/dds_db
          DATABASE_URL_SYNC=postgresql://dds:dds_ci_secret@db:5432/dds_db
          REDIS_URL=redis://:dds_ci_redis@redis:6379/0
          REDIS_PASSWORD=dds_ci_redis
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET=dds-files
          MINIO_SECURE=false
          SECRET_KEY=ci-test-secret-key-minimum-32-chars-long
          TESTING=1
          REGISTER_ENABLED=true
          DOTENV
          # Strip leading whitespace from .env (heredoc preserves indentation)
          sed -i 's/^[[:space:]]*//' .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('requirements-backend.txt', 'Dockerfile.backend') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build backend image with cache
        run: |
          docker buildx build \
            --file Dockerfile.backend \
            --tag dds_app-backend:latest \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Start services
        run: |
          docker compose up -d db pgbouncer redis minio backend
          echo "Waiting for services to be healthy..."
          docker compose exec -T backend python -c "print('Backend is up')" 2>/dev/null || sleep 10
          for i in {1..30}; do
            if docker compose exec -T backend python -c "
              import asyncio
              from backend.database import async_engine
              async def check():
                  async with async_engine.connect() as conn:
                      await conn.execute(__import__('sqlalchemy').text('SELECT 1'))
                      print('DB connected')
              asyncio.run(check())
            " 2>/dev/null; then
              echo "Database ready"
              break
            fi
            echo "  Waiting for DB... ($i/30)"
            sleep 2
          done

      - name: Run Alembic migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Run tests
        run: docker compose exec -T backend pytest tests/ -x --tb=short -q

      - name: Cleanup
        if: always()
        run: docker compose down -v 2>/dev/null || true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: cd frontend-react && npm ci --legacy-peer-deps || npm ci --legacy-peer-deps

      - name: Run vitest
        run: cd frontend-react && npx vitest run

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    # E2E пока нестабилен (73 теста × 1 worker не укладываются + seed-проблемы).
    # Не блокирует merge/deploy — чинится отдельно. Логи остаются для диагностики.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci --legacy-peer-deps || npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      - name: Create .env for docker-compose
        run: |
          cat > .env <<'DOTENV'
          POSTGRES_USER=dds
          POSTGRES_PASSWORD=dds_ci_secret
          POSTGRES_DB=dds_db
          DATABASE_URL=postgresql+asyncpg://dds:dds_ci_secret@db:5432/dds_db
          DATABASE_URL_SYNC=postgresql://dds:dds_ci_secret@db:5432/dds_db
          REDIS_URL=redis://:dds_ci_redis@redis:6379/0
          REDIS_PASSWORD=dds_ci_redis
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET=dds-files
          MINIO_SECURE=false
          SECRET_KEY=ci-test-secret-key-minimum-32-chars-long
          TESTING=1
          REGISTER_ENABLED=true
          DOTENV
          sed -i 's/^[[:space:]]*//' .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache backend Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache-backend
          key: ${{ runner.os }}-buildx-backend-${{ hashFiles('requirements-backend.txt', 'Dockerfile.backend') }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-

      - name: Cache frontend Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ hashFiles('frontend-react/package-lock.json', 'Dockerfile.react') }}
          restore-keys: |
            ${{ runner.os }}-buildx-frontend-

      - name: Build backend image with cache
        run: |
          docker buildx build \
            --file Dockerfile.backend \
            --tag dds_app-backend:latest \
            --cache-from type=local,src=/tmp/.buildx-cache-backend \
            --cache-to type=local,dest=/tmp/.buildx-cache-backend-new,mode=max \
            --load \
            .

      - name: Build frontend image with cache
        run: |
          docker buildx build \
            --file Dockerfile.react \
            --tag dds_app-frontend-react:latest \
            --cache-from type=local,src=/tmp/.buildx-cache-frontend \
            --cache-to type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max \
            --load \
            ./frontend-react

      - name: Move Docker caches
        run: |
          rm -rf /tmp/.buildx-cache-backend /tmp/.buildx-cache-frontend
          mv /tmp/.buildx-cache-backend-new  /tmp/.buildx-cache-backend  2>/dev/null || true
          mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend 2>/dev/null || true

      - name: Start services (backend + frontend + nginx)
        run: |
          docker compose up -d db pgbouncer redis minio backend frontend-react nginx
          echo "Waiting for nginx → frontend → backend to be ready on http://localhost..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost/ -o /dev/null 2>&1; then
              echo "✓ http://localhost is reachable (attempt $i)"
              break
            fi
            sleep 3
          done
          # Final check — fail fast with diagnostics if still down
          if ! curl -sf http://localhost/ -o /dev/null; then
            echo "❌ http://localhost unreachable after 270s"
            docker compose ps
            docker compose logs --tail=80 nginx frontend-react backend
            exit 1
          fi

      - name: Run Alembic migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Seed E2E test user (e2e_admin)
        run: |
          # Backend авто-создаёт 'admin' со СЛУЧАЙНЫМ паролем при старте
          # (ensure_default_admin в backend/auth.py) — поэтому логин admin/admin
          # никогда не работал. Создаём отдельного e2e_admin через /register
          # (REGISTER_ENABLED=true, пароль >= MIN_PASSWORD_LENGTH=8).
          # Если пользователь уже существует (400) — не падаем.
          HTTP_CODE=$(curl -s -o /tmp/register.out -w "%{http_code}" \
            -X POST http://localhost/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"e2e_admin","password":"e2e_pw_12345","email":"e2e@test.local"}')
          echo "Register HTTP $HTTP_CODE"
          cat /tmp/register.out
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "400" ]; then
            echo "❌ Unexpected register response"
            exit 1
          fi

      - name: Run Playwright tests
        working-directory: frontend-react
        env:
          E2E_USERNAME: e2e_admin
          E2E_PASSWORD: e2e_pw_12345
        # --reporter=list выводит каждый тест в лог (видно прогресс/зависший тест)
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend-react/playwright-report/

      - name: Cleanup
        if: always()
        run: docker compose down -v 2>/dev/null || true
