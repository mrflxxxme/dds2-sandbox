# Reactive CI: при падении критичных workflow создаёт tracking issue с root cause
# Запускается автоматически когда Tests или Security Audit упали на main/dev
name: CI Failure Auto-Issue

on:
  workflow_run:
    workflows: ["Tests", "Security Audit"]
    types: [completed]
    branches: [main, dev]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  create-issue:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Collect failure context
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // Получить логи failed jobs
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo,
              run_id: run.id
            });
            const failed = jobs.data.jobs.filter(j => j.conclusion === 'failure');

            const summary = failed.map(j => {
              const failedSteps = j.steps.filter(s => s.conclusion === 'failure').map(s => s.name);
              return `- **${j.name}** → ${failedSteps.join(', ')}`;
            }).join('\n');

            // Проверить есть ли уже открытый issue для этого workflow
            const existing = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'ci-failure,auto',
              state: 'open'
            });
            const sameWorkflow = existing.data.find(i =>
              i.title.includes(`[${run.name}]`) && i.title.includes(run.head_branch)
            );

            if (sameWorkflow) {
              // Обновить existing issue новым комментом
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: sameWorkflow.number,
                body: `### New failure: [Run #${run.run_number}](${run.html_url})\n\nFailed jobs:\n${summary}\n\nCommit: ${run.head_sha.substring(0,7)} by @${run.actor.login}`
              });
              core.setOutput('action', 'commented');
              core.setOutput('number', sameWorkflow.number);
            } else {
              // Создать новый issue
              const body = [
                `**Workflow**: [${run.name} #${run.run_number}](${run.html_url})`,
                `**Branch**: \`${run.head_branch}\``,
                `**Commit**: ${run.head_sha.substring(0,7)} by @${run.actor.login}`,
                `**Triggered by**: ${run.event}`,
                ``,
                `### Failed jobs`,
                summary || '_(see workflow run)_',
                ``,
                `### Next steps`,
                `1. Open the [run logs](${run.html_url}) to see the exact error`,
                `2. If flaky — add \`@claude\` comment with re-run request`,
                `3. If real bug — assign yourself, fix, close this issue`,
                ``,
                `---`,
                `_Auto-generated by \`ci-failure-issue.yml\`. Closes automatically when the same workflow passes on \`${run.head_branch}\`._`
              ].join('\n');

              const issue = await github.rest.issues.create({
                owner, repo,
                title: `[${run.name}] ${run.head_branch} failed on ${run.head_sha.substring(0,7)}`,
                body,
                labels: ['ci-failure', 'auto']
              });
              core.setOutput('action', 'created');
              core.setOutput('number', issue.data.number);
            }

      - name: Summary
        run: |
          echo "### CI Failure ${{ steps.ctx.outputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "Issue: #${{ steps.ctx.outputs.number }}" >> $GITHUB_STEP_SUMMARY

  close-on-success:
    # Закрыть открытые issue когда workflow снова зелёный
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            const existing = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'ci-failure,auto',
              state: 'open'
            });
            const match = existing.data.find(i =>
              i.title.includes(`[${run.name}]`) && i.title.includes(run.head_branch)
            );

            if (match) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: match.number,
                body: `✅ **Passing again**: [Run #${run.run_number}](${run.html_url}) succeeded. Closing.`
              });
              await github.rest.issues.update({
                owner, repo,
                issue_number: match.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
