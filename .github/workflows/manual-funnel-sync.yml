name: Manual Funnel Sync

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Date from (YYYY-MM-DD)'
        required: true
        default: '2026-03-22'
      date_to:
        description: 'Date to (YYYY-MM-DD)'
        required: true
        default: '2026-03-22'
      project_id:
        description: 'Project ID'
        required: true
        default: '4'

jobs:
  sync:
    name: Run funnel sync via worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run sync on App Server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Use single SSH command with inline python via docker exec
          # This is the same approach that works when run manually via SSH
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${USER}@${HOST} \
            "cd /opt/dds_app && docker compose -f docker-compose.app.yml exec -T -w /app worker python3 -c \"
          import sys; sys.path.insert(0, '/app')
          import asyncio, json, logging
          logging.basicConfig(level=logging.INFO)
          async def main():
              from backend.database import AsyncSessionLocal
              from backend.services.funnel.sync import run_funnel_sync
              async with AsyncSessionLocal() as db:
                  result = await run_funnel_sync(db, ${PROJECT_ID}, '${DATE_FROM}', '${DATE_TO}', include_completed_campaigns=True)
                  print(json.dumps(result, indent=2, default=str))
          asyncio.run(main())
          \""
