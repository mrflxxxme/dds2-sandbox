# Auto Docs & Learn Sync — автоматическое обновление documentation + learnings
# Запускается 2 раза в день. Анализирует новые коммиты в dev с момента последнего
# [auto-learn], извлекает уроки/обновляет docs через Claude headless, коммитит в dev.
#
# Работает в паре с:
# - scripts/hooks/post-commit-track.sh      → пишет в .pending-learn.log (локально)
# - scripts/hooks/post-commit-docs-track.sh → пишет в .pending-docs.log (локально)
# - .claude/commands/learn.md               → процесс /learn
# - .claude/commands/docs.md                → процесс /docs
#
# Триггер auto-pr.yml (push в dev) → CI → auto-merge → cd-production.
name: Auto Docs & Learn Sync

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC (09:00 MSK) — утренний прогон перед началом рабочего дня
    # 18:00 UTC (21:00 MSK) — вечерний прогон после окончания
    - cron: '0 6,18 * * *'

permissions:
  contents: write
  id-token: write

jobs:
  auto-sync:
    name: Extract learnings + update docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find pending commits since last [auto-learn]
        id: pending
        run: |
          set -euo pipefail

          # Последний auto-learn коммит (или fallback: 7 дней назад)
          LAST_AUTO=$(git log --format='%H' --grep='\[auto-learn\]' -1 || true)
          if [ -z "$LAST_AUTO" ]; then
            LAST_AUTO=$(git log --format='%H' --before='7 days ago' -1 || echo "")
          fi
          echo "Last auto-learn base: ${LAST_AUTO:-<none>}"

          RANGE="${LAST_AUTO}..HEAD"
          [ -z "$LAST_AUTO" ] && RANGE="HEAD"

          # Отфильтровать: не merge, не docs-only, не auto-*
          git log $RANGE --no-merges --format='%h %s' 2>/dev/null \
            | grep -vE '^[0-9a-f]+ (docs:|docs\(|chore\(memory\)|chore\(auto\)|Merge )' \
            | grep -vE '\[auto-learn\]|\[auto-docs\]' \
            > pending.txt || true

          COUNT=$(wc -l < pending.txt | tr -d ' ')
          : "${COUNT:=0}"
          echo "Pending commits: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "--- pending.txt ---"
            cat pending.txt
          fi

      - name: Skip if too few commits
        if: steps.pending.outputs.count == '0' || steps.pending.outputs.count < '3'
        run: |
          echo "Only ${{ steps.pending.outputs.count }} pending commit(s) — threshold is 3. Skip."
          exit 0

      - name: Run Claude auto-learn + auto-docs
        if: steps.pending.outputs.count >= '3'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-opus-4-7 --max-turns 60
          prompt: |
            Ты запущен в cron workflow для синхронизации документации DDS2.
            Текущая ветка: dev. Рабочая директория: репозиторий.

            В файле `pending.txt` (в корне) — список коммитов которые прошли мимо
            процессов /learn и /docs. Твоя задача: обработать их батчем.

            ## Процедура

            **1. Прочитай `pending.txt`** — там формат `<short-hash> <subject>` по строкам.
               Если файла нет или он пустой — ничего не делай, exit без коммита.

            **2. Для каждого коммита:**
               - `git show --stat <hash>` для списка файлов
               - `git show <hash> -- <интересные файлы>` для диффов
               - Выделяй только СИГНАЛ (не шум): паттерны, антипаттерны, исправленные баги,
                 новые модули, изменения конвенций. Мелкий рефакторинг/typo — пропускай.

            **3. Извлеки уроки по 4 категориям** (см. `.claude/commands/learn.md`):

               **3a. Антипаттерн** → добавь в `.claude/rules/learnings.md` секция
                  «Антипаттерны (не повторять)». Только если раньше такого не было.
                  Если можно — добавь check в `scripts/check_conventions.sh`.

               **3b. Паттерн** → в `.claude/rules/learnings.md` секция
                  «Паттерны которые работают». Если повторяется 3+ раз — создай template
                  в `.claude/templates/`.

               **3c. Fix багов** → если коммит `fix:` и связан с записью в
                  `memory/project_known_bugs.md` «Актуальные» — перенеси в «Исправленные»
                  с номером коммита.

               **3d. Новый баг/tech debt** → если в diff видишь TODO/FIXME/HACK или
                  явный workaround — запиши в `memory/project_known_bugs.md` «Актуальные».

            **4. Обнови документацию** (см. `.claude/commands/docs.md`):
               - Новая модель с SoftDeleteMixin → `backend/DOMAIN_*.md` + `SOFT_MODELS`
                 в `scripts/check_conventions.sh`
               - Новый сервис/роутер → `backend/MAP.md` + соответствующий `DOMAIN_*.md`
               - Новый endpoint → OpenAPI автогенерится, но упомяни в `DOMAIN_*.md`
               - Новый workflow `.github/workflows/*.yml` → таблица в `CLAUDE.md`
                 «Operational workflows»
               - Новая конвенция → `CLAUDE.md` «Железные правила» или «Антипаттерны»
               - Изменение бизнес-логики → соответствующий `DOMAIN_*.md`

            **5. Правила минимализма:**
               - НЕ дублируй существующие уроки — ВСЕГДА прочитай `learnings.md` и
                 `memory/project_known_bugs.md` перед записью
               - НЕ создавай новые файлы кроме templates и memory/feedback_*.md
               - НЕ пиши воду — только конкретные факты
               - Если за батч ничего нового нет — не коммить, exit 0

            **6. Коммит и push** — ОБЯЗАТЕЛЬНО с меткой `[auto-learn]`:

               ```
               git config user.email "noreply@anthropic.com"
               git config user.name "Claude Auto-Learn"
               git add -A
               git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
               COMMIT_COUNT=$(wc -l < pending.txt | tr -d ' ')
               git commit -m "chore(auto): [auto-learn] [auto-docs] sync $COMMIT_COUNT commits

               Processed via auto-docs-learn.yml cron workflow.
               Source commits: see pending.txt in run artifacts.

               Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
               git pull --rebase origin dev || true
               git push origin dev
               ```

               **КРИТИЧНО:** метки `[auto-learn]` и `[auto-docs]` нужны чтобы
               post-commit-track.sh и post-commit-docs-track.sh пропустили этот коммит
               (иначе рекурсия). Без них — бесконечный цикл.

            **7. Отчёт** — в конце выведи таблицу что сделал:

               ```
               | Категория | Что добавлено | Файл |
               |-----------|---------------|------|
               | Антипаттерн | X | learnings.md |
               | Паттерн    | Y | learnings.md, templates/Z.tmpl |
               | Исправлен баг | P32 | project_known_bugs.md |
               | DOMAIN | новый раздел Scheduler | DOMAIN_WB.md |
               ```

            Если обработка невозможна (конфликт merge, unclear diffs) — не делай коммит,
            просто выведи объяснение и exit 0. Лучше пропустить чем нашуметь.

      - name: Upload pending.txt as artifact
        if: always() && steps.pending.outputs.count >= '3'
        uses: actions/upload-artifact@v4
        with:
          name: pending-commits-${{ github.run_id }}
          path: pending.txt
          retention-days: 30
