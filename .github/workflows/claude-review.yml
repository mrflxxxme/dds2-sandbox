# Claude Code automated PR review
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model routing: opus-4-7 для PR с лейблом security/high-risk, sonnet-4-6 для остального
          # Opus даёт глубже анализ для критичных изменений; Sonnet быстрее и дешевле для рутины
          claude_args: ${{ (contains(github.event.pull_request.labels.*.name, 'security') || contains(github.event.pull_request.labels.*.name, 'high-risk')) && '--model claude-opus-4-7 --max-turns 15' || '--model claude-sonnet-4-6 --max-turns 10' }}
