# Claude Code automated PR review
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model: opus 4.7 везде (Max подписка, требование владельца 2026-04-21)
          # Max-turns поднят для high-risk/security PR (есть лейбл) — тщательнее
          claude_args: ${{ (contains(github.event.pull_request.labels.*.name, 'security') || contains(github.event.pull_request.labels.*.name, 'high-risk')) && '--model claude-opus-4-7 --max-turns 25' || '--model claude-opus-4-7 --max-turns 20' }}
