name: DDS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Run linter
        run: |
          ruff check backend/ --select E,W,F --ignore E501

      - name: Check formatting
        run: |
          ruff format --check backend/

      - name: Domain convention checks
        run: |
          bash scripts/check_conventions.sh

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci || npm install

      - name: Lint
        working-directory: frontend-react
        run: npm run lint || true

      - name: Build
        working-directory: frontend-react
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: [lint, frontend-check]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dds
          POSTGRES_PASSWORD: dds_secret
          POSTGRES_DB: dds_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dds -d dds_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements-backend.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://dds:dds_secret@localhost:5432/dds_db
          DATABASE_URL_SYNC: postgresql://dds:dds_secret@localhost:5432/dds_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-minimum-32-characters-long
        run: |
          python -m pytest tests/ -v --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            git pull origin main
            docker compose up -d --build --remove-orphans
            # Migrations run automatically via entrypoint.sh
            echo "✅ Deployed at $(date)"
