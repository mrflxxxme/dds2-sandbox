# Auto-merge PR from dev to main after CI passes
name: Auto Merge

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  checks: read
  actions: read

jobs:
  auto-merge:
    name: Auto-merge dev → main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run when the triggering workflow succeeded
    if: >
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v6

      - name: Find and auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # Find open PR from dev to main
          PR_NUMBER=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR from dev → main found, skipping"
            exit 0
          fi

          echo "Found PR #${PR_NUMBER}"

          # Get PR info in one call
          PR_INFO=$(gh pr view "$PR_NUMBER" --json author,state,headRefOid)
          PR_AUTHOR=$(echo "$PR_INFO" | jq -r '.author.login')
          PR_STATE=$(echo "$PR_INFO" | jq -r '.state')
          HEAD_SHA=$(echo "$PR_INFO" | jq -r '.headRefOid')

          echo "PR author: ${PR_AUTHOR}, state: ${PR_STATE}, HEAD: ${HEAD_SHA:0:7}"

          # Verify author
          if [ "$PR_AUTHOR" != "github-actions" ] && [ "$PR_AUTHOR" != "github-actions[bot]" ] && [ "$PR_AUTHOR" != "app/github-actions" ] && [ "$PR_AUTHOR" != "vladbydaev37" ]; then
            echo "PR not by auto-pr or owner (author: ${PR_AUTHOR}), skipping"
            exit 0
          fi

          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #${PR_NUMBER} is ${PR_STATE}, skipping"
            exit 0
          fi

          # ── Check CI status via REST API (no GraphQL!) ──
          echo "Checking CI status via REST API..."

          # 1. Check runs (GitHub Actions workflows)
          CHECK_RUNS=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" --jq '
            [.check_runs[] |
              select(.name != "Auto-merge dev → main") |
              {name: .name, status: .status, conclusion: .conclusion}
            ]')

          TOTAL=$(echo "$CHECK_RUNS" | jq 'length')
          PENDING=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status != "completed")] | length')
          FAILED=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')

          echo "Check runs: ${TOTAL} total, ${PENDING} pending, ${FAILED} failed"

          if [ "$TOTAL" -eq 0 ]; then
            echo "No check runs found, skipping"
            exit 0
          fi

          if [ "$PENDING" -gt 0 ]; then
            echo "Pending checks:"
            echo "$CHECK_RUNS" | jq -r '.[] | select(.status != "completed") | "  - \(.name): \(.status)"'
            echo "Skipping — will retry on next trigger"
            exit 0
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "Failed checks:"
            echo "$CHECK_RUNS" | jq -r '.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "  - \(.name): \(.conclusion)"'
            echo "Skipping — checks not green"
            exit 0
          fi

          # 2. Commit statuses (external integrations like Snyk)
          STATUSES=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" --jq '.state')
          echo "Commit status: ${STATUSES}"

          if [ "$STATUSES" = "failure" ] || [ "$STATUSES" = "error" ]; then
            echo "Commit status is ${STATUSES}, skipping"
            exit 0
          fi

          echo "All checks passed!"

          # Check if branch is behind base — update if needed
          MERGE_STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')
          echo "Merge state: ${MERGE_STATE}"

          if [ "$MERGE_STATE" = "BEHIND" ]; then
            echo "Branch is behind base, updating..."
            gh api -X PUT "repos/${REPO}/pulls/${PR_NUMBER}/update-branch" \
              --field expected_head_sha="$HEAD_SHA" || true
            echo "Branch update requested — CI will re-trigger auto-merge"
            exit 0
          fi

          echo "Merging PR #${PR_NUMBER}..."
          gh pr merge "$PR_NUMBER" --merge --delete-branch=false
