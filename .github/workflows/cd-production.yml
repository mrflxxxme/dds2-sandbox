# CI/CD — Deploy to Production (3-server architecture)
#
# Architecture:
#   App Server (DEPLOY_HOST)  — backend, worker, frontend, nginx
#   Data Server (DATA_HOST)   — PostgreSQL, PgBouncer, Redis, MinIO
#   Monitoring (MON_HOST)     — Prometheus, Grafana, AlertManager
#
# Flow: dev → staging → verify → merge to main → this workflow
#
# Requires GitHub Secrets:
#   DEPLOY_HOST     — App server IP (130.49.150.69)
#   DEPLOY_USER     — SSH user (root)
#   DEPLOY_SSH_KEY  — private SSH key
#   DEPLOY_PATH     — path to project (e.g. /opt/dds_app)
#   DATA_HOST       — Data server IP (194.67.100.57)

name: Deploy to Production

on:
  push:
    branches: [main]

# Only one production deploy at a time, never cancel in progress
concurrency:
  group: deploy-production
  cancel-in-progress: false

# git pull на хосте — read-only, хватает per-run GITHUB_TOKEN (не протухает, не требует ротации).
# Раньше тут был GH_PAT, который протух (~30 дней) и уронил деплой "could not read Password".
permissions:
  contents: read

jobs:
  # Тесты здесь НЕ пере-прогоняются: PR dev→main уже прошёл Tests + Security
  # (required checks), а auto-merge гейтит merge на их зелёности. Сетка
  # безопасности — health-check с авто-откатом (ниже) + post-merge.yml.
  # Раньше повторный прогон test.yml добавлял ~8-9 мин к каждому деплою.
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      # Step 1: Pre-deploy backup on Data server
      - name: Backup database on Data server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DATA_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script-stop: true
          script: |
            set -e
            cd /opt/dds_data
            echo "📦 Pre-deploy backup..."
            docker compose exec -T db pg_dump -U dds dds_db | gzip > backups/pre-deploy-$(date +%Y%m%d_%H%M%S).sql.gz
            echo "✅ Backup created on Data server"

      # Step 2: Verify backup before deploying
      - name: Verify backup size
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DATA_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script-stop: true
          script: |
            set -e
            cd /opt/dds_data
            LATEST_BACKUP=$(ls -t backups/pre-deploy-*.sql.gz 2>/dev/null | head -1)
            if [ -z "$LATEST_BACKUP" ]; then
              echo "❌ No pre-deploy backup found!"
              exit 1
            fi
            BACKUP_SIZE=$(stat -c%s "$LATEST_BACKUP" 2>/dev/null || stat -f%z "$LATEST_BACKUP")
            echo "📦 Backup: $LATEST_BACKUP ($BACKUP_SIZE bytes)"
            if [ "$BACKUP_SIZE" -lt 10240 ]; then
              echo "❌ Backup too small ($BACKUP_SIZE bytes < 10KB), aborting deploy"
              exit 1
            fi
            echo "✅ Backup verified ($BACKUP_SIZE bytes)"

      # Step 3: Deploy App server
      - name: Deploy App server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script-stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📥 Pulling main branch..."
            git stash --include-untracked 2>/dev/null || true
            git checkout main 2>/dev/null || true
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vladbydaev37/dds2.git 2>/dev/null || true
            git pull origin main

            echo "📦 Pre-pulling base images (with retry)..."
            for image in python:3.11-slim node:20-slim; do
              for attempt in 1 2 3; do
                if docker pull "$image"; then
                  echo "✅ Pulled $image"
                  break
                fi
                echo "⚠️ Pull $image failed (attempt $attempt/3), retrying in 10s..."
                sleep 10
              done
            done

            echo "🔨 Building and restarting all services..."
            # autoheal added 2026-04-14: watches autoheal=true labels and restarts
            # unhealthy containers (incident-2026-04-14 root cause was backend hung
            # `unhealthy` 15h because restart: unless-stopped only handles exited).
            docker compose -f docker-compose.app.yml up -d --build --remove-orphans --force-recreate backend worker frontend-react nginx autoheal

            echo "🗄️ Running migrations on Data server..."
            # Вариант B (migration-fail recovery): при фейле миграции откатываем КОД на
            # HEAD~1 (чтобы прод не отдавал 500 с новым кодом на сломанной схеме). БД
            # автоматически НЕ трогаем — для финансовых данных restore решает человек
            # (см. /rollback: схему авто не откатываем). Бэкап уже создан в Step 1.
            if ! docker compose -f docker-compose.app.yml exec -T backend alembic upgrade head; then
              MIGR_COUNT=$(git diff --name-only HEAD~1 HEAD -- migrations/versions/ 2>/dev/null | wc -l | tr -d ' ')
              echo "❌ Миграция упала — откатываю КОД на HEAD~1, БД оставляю как есть..."
              git checkout HEAD~1 -- .
              docker compose -f docker-compose.app.yml up -d --build backend worker frontend-react
              echo "🔄 Код откатан на HEAD~1. БД автоматически НЕ изменялась."
              echo "::error::Migration failed. Код откатан на HEAD~1, БД НЕ тронута (${MIGR_COUNT} migration-файл(ов) в деплое). Restore вручную на Data-сервере: docker compose exec -T db-backup /scripts/restore.sh <последний pre-deploy-*.sql.gz из /opt/dds_data/backups>. Обратимая одиночная миграция: alembic downgrade -1."
              exit 1
            fi
            echo "✅ Migrations applied"

            echo "🏥 Health check..."
            sleep 15
            if curl -sf https://app.vyatkin-wb.ru/health > /dev/null 2>&1; then
              echo "✅ HTTPS health check passed"
            elif curl -sf http://localhost/health > /dev/null 2>&1; then
              echo "✅ HTTP health check passed"
            else
              echo "❌ Health check failed!"
              # Детектим миграции между HEAD~1 и HEAD — если есть, код откатывать нельзя
              # без alembic downgrade + restore backup (иначе schema drift → 500 on prod)
              MIGRATIONS_CHANGED=$(git diff --name-only HEAD~1 HEAD -- migrations/versions/ 2>/dev/null | wc -l | tr -d ' ')
              if [ "${MIGRATIONS_CHANGED:-0}" -gt 0 ]; then
                echo "⚠️ Миграции изменены (${MIGRATIONS_CHANGED} файлов) — автооткат кода ОТМЕНЁН"
                echo "⚠️ Требуется ручной rollback: (a) alembic downgrade -N; (b) restore /opt/dds_data/backups/pre-deploy-*.sql.gz; (c) git checkout HEAD~1 -- ."
                echo "⚠️ Контейнеры оставлены в текущем (broken) состоянии — нужно diagnose"
                exit 1
              fi
              echo "Миграций в коммите нет — откатываем только код..."
              git checkout HEAD~1 -- .
              docker compose -f docker-compose.app.yml up -d --build backend worker frontend-react
              echo "🔄 Rollback complete"
              exit 1
            fi

            echo "🔒 SSL certificate status:"
            timeout 30 docker compose -f docker-compose.app.yml run --rm certbot certificates 2>/dev/null || echo "  (certbot check skipped/timed out)"

            echo "✅ Production deploy successful!"

      # Step 4: Verify database is accessible after deploy
      - name: Verify DB after deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DATA_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script-stop: true
          script: |
            set -e
            cd /opt/dds_data
            echo "🏥 Post-deploy DB health check..."
            if docker compose exec -T db psql -U dds dds_db -c 'SELECT 1' > /dev/null 2>&1; then
              echo "✅ PostgreSQL is responding"
            else
              echo "❌ PostgreSQL is NOT responding after deploy!"
              exit 1
            fi

            # Verify PgBouncer connectivity
            if docker compose exec -T pgbouncer psql -U dds -p 6432 dds_db -c 'SELECT 1' > /dev/null 2>&1; then
              echo "✅ PgBouncer is responding"
            else
              echo "⚠️ PgBouncer is not responding (DB direct access works)"
            fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deploy failed! Check server logs."
