# CI — Security audit (pip-audit + gitleaks + Snyk Code SAST)
# Runs on push/PR and can be triggered manually

name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # Daily 05:00 UTC — security sentinel
  push:
    branches: [main, dev]
    paths:
      - 'requirements*.txt'
      - 'backend/**'
      - 'frontend-react/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - 'backend/**'
      - 'frontend-react/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        # --ignore-vuln: pyasn1 CVE-2026-30922 — pinned by python-jose<0.5.0, no fix without replacing library
        # --ignore-vuln: pytest CVE-2025-71176 — dev/test dependency only, runtime risk = 0; tracked for upgrade to 9.0.3+
        run: pip-audit --strict -r requirements-backend.txt --ignore-vuln CVE-2026-30922 --ignore-vuln CVE-2025-71176

      - name: Audit worker/other dependencies (if exists)
        run: |
          for f in requirements*.txt; do
            if [ "$f" != "requirements-backend.txt" ]; then
              echo "=== Auditing $f ==="
              pip-audit --strict -r "$f" || true
            fi
          done

  gitleaks:
    name: gitleaks (secrets in git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-scan:
    name: Trivy (filesystem vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  snyk-code:
    name: Snyk Code (SAST)
    runs-on: ubuntu-latest
    # Advisory-only: не блокирует CI
    # Требует SNYK_TOKEN secret → https://app.snyk.io/account → API Token
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Code analysis
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
        continue-on-error: true

  npm-audit:
    name: npm audit (frontend vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci --legacy-peer-deps || npm ci --legacy-peer-deps

      - name: Run npm audit
        working-directory: frontend-react
        run: npm audit --audit-level=high
