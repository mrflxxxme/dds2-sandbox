# CI — Security audit (pip-audit + gitleaks)
# Runs on push/PR and can be triggered manually

name: Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'requirements*.txt'
      - 'backend/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'requirements*.txt'

jobs:
  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        # --ignore-vuln: pyasn1 CVE-2026-30922 — pinned by python-jose<0.5.0, no fix without replacing library
        run: pip-audit --strict -r requirements-backend.txt --ignore-vuln CVE-2026-30922

      - name: Audit worker/other dependencies (if exists)
        run: |
          for f in requirements*.txt; do
            if [ "$f" != "requirements-backend.txt" ]; then
              echo "=== Auditing $f ==="
              pip-audit --strict -r "$f" || true
            fi
          done

  gitleaks:
    name: gitleaks (secrets in git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-scan:
    name: Trivy (filesystem vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0  # advisory-only, не блокирует CI (меняй на 1 для strict mode)
          format: table
