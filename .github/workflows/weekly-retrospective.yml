# Weekly retrospective: анализ git log за неделю → tracking issue с предложениями
# Воскресенье 07:00 UTC (после server-cleanup в Sun 03:00)
name: Weekly Retrospective

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 0'  # Воскресенье 07:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  retrospective:
    name: Generate weekly retro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full git history

      - name: Generate retrospective
        run: |
          set -euo pipefail

          DATE=$(date +%Y-%m-%d)
          WEEK_AGO=$(date -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -v-7d +%Y-%m-%d)

          {
            echo "## Weekly Retrospective — week ending $DATE"
            echo ""
            echo "_Source: \`git log --since=$WEEK_AGO\` on \`main\`_"
            echo ""

            echo "### Commits by type (semantic prefix)"
            echo ""
            echo '```'
            git log --since="$WEEK_AGO" --format='%s' main 2>/dev/null \
              | grep -oE '^(feat|fix|refactor|chore|docs|test|infra|perf|style)' \
              | sort | uniq -c | sort -rn || true
            echo '```'
            echo ""

            echo "### Top 10 most-changed files (last 7 days)"
            echo ""
            echo '```'
            git log --since="$WEEK_AGO" --format= --name-only main 2>/dev/null \
              | sort | uniq -c | sort -rn | head -10 || true
            echo '```'
            echo ""

            echo "### Reverts and hotfixes (signals of issues)"
            echo ""
            REVERTS=$(git log --since="$WEEK_AGO" --format='- %h %s' main --grep='revert\|hotfix\|emergency' -i 2>/dev/null || echo "")
            if [ -n "$REVERTS" ]; then
              echo "$REVERTS"
            else
              echo "_None — clean week_"
            fi
            echo ""

            echo "### Files modified 3+ times (potential refactor candidates)"
            echo ""
            echo '```'
            git log --since="$WEEK_AGO" --format= --name-only main 2>/dev/null \
              | sort | uniq -c | awk '$1 >= 3 {print}' | sort -rn | head -20 || true
            echo '```'
            echo ""

            echo "### Suggested actions"
            echo "- Review files modified 3+ times — possible refactor target"
            echo "- Cross-check reverts with \`memory/project_known_bugs.md\`"
            echo "- Run \`/consolidate-memory\` skill to dedupe stale facts"
            echo "- If many \`fix:\` commits in same domain → review root cause"
            echo ""
            echo "_Auto-generated by weekly-retrospective workflow_"
          } > retro.md

      - name: Create or update retro issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('retro.md', 'utf8');
            const date = new Date().toISOString().slice(0,10);
            const title = `[retro] Weekly — ${date}`;

            // Создаём всегда новое, не апдейтим (хотим историю по неделям)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['retrospective', 'sentinel']
            });
