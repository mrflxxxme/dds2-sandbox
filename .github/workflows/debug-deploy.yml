name: Debug Deploy

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug Server State
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check server state
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${USER}@${HOST} '
            cd /opt/dds_app
            echo "=== GIT BRANCH ==="
            git branch --show-current
            echo "=== GIT LOG ==="
            git log --oneline -5
            echo "=== NGINX CONF (health section) ==="
            grep -A3 "nginx-health\|/health" nginx/nginx.conf 2>&1
            echo "=== DOCKER COMPOSE HEALTHCHECK ==="
            grep -A3 "healthcheck" docker-compose.app.yml 2>&1 | head -20
            echo "=== TEST NGINX-HEALTH ==="
            docker compose -f docker-compose.app.yml exec -T nginx wget --spider http://localhost/nginx-health 2>&1 || echo "FAILED"
            echo "=== TEST /HEALTH ==="
            docker compose -f docker-compose.app.yml exec -T nginx wget --spider http://localhost/health 2>&1 || echo "FAILED"
          ' > /tmp/debug_output.txt 2>&1 || true
          cat /tmp/debug_output.txt

      - name: Post results
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os
          output = open('/tmp/debug_output.txt').read() if os.path.exists('/tmp/debug_output.txt') else 'No output'
          body = f"## Debug\n```\n{output}\n```"
          payload = json.dumps({"title": "[Debug] Server state check", "body": body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues",
              data=payload,
              headers={"Authorization": f"token {os.environ['GH_PAT']}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}
          )
          resp = urllib.request.urlopen(req)
          result = json.loads(resp.read())
          print(f"Issue #{result['number']}")
          PYEOF
