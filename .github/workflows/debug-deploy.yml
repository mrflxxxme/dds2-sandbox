name: Debug Deploy

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug Deploy Steps
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recreate nginx on App Server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${USER}@${HOST} '
            cd /opt/dds_app
            echo "=== FORCE RECREATE NGINX ==="
            docker compose -f docker-compose.app.yml up -d --force-recreate nginx 2>&1
            sleep 30
            echo "=== PS ==="
            docker compose -f docker-compose.app.yml ps 2>&1
          ' > /tmp/debug_output.txt 2>&1 || true
          cat /tmp/debug_output.txt

      - name: Post results to issue
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os

          output = open('/tmp/debug_output.txt').read() if os.path.exists('/tmp/debug_output.txt') else 'No output captured'

          body = f"## Nginx Recreate Results\n```\n{output}\n```"
          payload = json.dumps({"title": "[Debug] Nginx recreate", "body": body}).encode()

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues",
              data=payload,
              headers={
                  "Authorization": f"token {os.environ['GH_PAT']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"
              }
          )
          try:
              resp = urllib.request.urlopen(req)
              result = json.loads(resp.read())
              print(f"Created issue #{result['number']}: {result['html_url']}")
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          PYEOF
