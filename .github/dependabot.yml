# Dependabot — automatic dependency updates
# https://docs.github.com/en/code-security/dependabot
#
# POLICY: only patch/minor updates auto-PR. Major versions need manual upgrade.
version: 2
updates:
  # Python backend dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/Moscow"
    reviewers:
      - vladbydaev37
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Группировать non-major апдейты в один PR — меньше шума, легче auto-merge
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Node.js frontend dependencies
  - package-ecosystem: npm
    directory: "/frontend-react"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/Moscow"
    reviewers:
      - vladbydaev37
    labels:
      - dependencies
      - frontend
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
