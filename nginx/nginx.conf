upstream frontend {
    server frontend-react:3000;
}

upstream backend {
    server backend:8000;
}

# ─── Rate limiting zones ─────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# ─── HTTP server (main) ──────────────────────────────────────────────────────
# When SSL is ready, uncomment the HTTPS block below and change this to redirect:
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    # ── Uncomment when SSL certificate is installed ──────────────────────────
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # ─── Security headers ─────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* wss://localhost:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # Uncomment with HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ─── Let's Encrypt challenge (for certbot) ────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── Auth rate limiting (brute-force protection) ──────────────────────
    location /api/v1/auth/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── API → backend (FastAPI) ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Nginx own health (for Docker healthcheck — no backend dependency) ─
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ─── Health check shortcut (proxied to backend) ──────────────────────
    location /health {
        proxy_pass http://backend/health;
    }

    # ─── Prometheus Metrics (internal only) ──────────────────────────────
    location /metrics {
        proxy_pass http://backend/metrics;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
    }

    # ─── Grafana (optional — resolves at runtime, won't crash if absent) ──
    location /grafana/ {
        resolver 127.0.0.11 valid=30s;
        set $grafana_upstream http://grafana:3000;
        proxy_pass         $grafana_upstream/grafana/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket ───────────────────────────────────────────────────────
    location /api/v1/ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout 86400s;
    }

    # ─── Everything else → frontend (Next.js) ─────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
