# Prometheus Alert Rules for DDS
groups:
  - name: dds_alerts
    rules:
      # ─── API ─────────────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate > 5%"
          description: "{{ $value | humanizePercentage }} ошибок за последние 5 минут"

      - alert: SlowResponses
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency > 2s"
          description: "p95 = {{ $value | humanizeDuration }}"

      - alert: HighRequestRate
        expr: rate(http_requests_total[1m]) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High request rate (> 100 req/min)"

      # ─── PostgreSQL ──────────────────────────────────────────────────────
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections > 80%"
          description: "{{ $value | humanizePercentage }} от max_connections"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down!"

      - alert: PostgresSlowQueries
        expr: rate(pg_stat_activity_max_tx_duration{datname="dds_db"}[5m]) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Long-running PostgreSQL transactions (> 60s)"

      # ─── Redis ───────────────────────────────────────────────────────────
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down!"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 80%"

      - alert: RedisCacheHitRateLow
        expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Redis cache hit rate < 50%"

      # ─── Slow Reports ──────────────────────────────────────────────────
      - alert: SlowReportEndpoint
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{handler=~"/api/v1/reports/.*|/api/v1/wb-bdr|/api/v1/opiu"}[5m])) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Report endpoint p95 > 5s"
          description: "{{ $labels.handler }} p95 = {{ $value | humanizeDuration }}"

      # ─── Disk ──────────────────────────────────────────────────────────
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space < 15% free"
          description: "{{ $value | humanizePercentage }} свободно на /"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Disk space < 5% — CRITICAL!"

      # ─── Container health ──────────────────────────────────────────────
      - alert: ContainerRestarting
        expr: increase(container_restart_count[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting frequently"
          description: "{{ $value }} restarts in last hour"
