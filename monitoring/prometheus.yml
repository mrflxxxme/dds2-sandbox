# Prometheus Configuration for DDS
# Scrape interval: 15s for all targets

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # ─── FastAPI Backend Metrics ─────────────────────────────────────────────
  - job_name: 'fastapi'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'api'

  # ─── FastAPI Worker Metrics ──────────────────────────────────────────────
  - job_name: 'worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:8000']
        labels:
          service: 'worker'

  # ─── PostgreSQL Metrics ──────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ─── Redis Metrics ──────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ─── Prometheus Self-Monitoring ──────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
