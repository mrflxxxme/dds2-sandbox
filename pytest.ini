[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Collect only from tests/. Without this, a path-less `pytest` (e.g. the
# pre-push hook's `pytest --testmon`) recursively scans the rootdir and trips
# ImportPathMismatchError on stray project copies — a mutmut `mutants/` dir
# inside the backend container has its own duplicate tests/conftest.py.
testpaths = tests

# xdist: route all tests in one file to a single worker. Needed because
# many test files use autouse fixtures with shared project_id=1 + DELETE —
# parallel tests in the same file race on DB state (StaleDataError).
# Takes effect only when -n is passed; no-op for serial runs.
addopts = --dist=loadfile

markers =
    unit: Unit tests (no DB, no external services)
    integration: Integration tests (requires DB)
    slow: Slow tests (skip in quick runs)
