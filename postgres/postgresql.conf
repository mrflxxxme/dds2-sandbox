# PostgreSQL 15 — Custom configuration for DDS
# Optimized for 4GB RAM server with connection pooling (PgBouncer)
#
# Mount: postgres/postgresql.conf → /etc/postgresql/postgresql.conf
# Usage: docker-compose → command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'

# ─── Connections ──────────────────────────────────────────────────────────────
# PgBouncer handles client connections, PostgreSQL sees fewer direct connections
listen_addresses = '*'                # Listen on all interfaces (required for Docker networking)
max_connections = 300

# ─── Memory ──────────────────────────────────────────────────────────────────
shared_buffers = 512MB                # ~25% of available RAM (server shared with other containers)
effective_cache_size = 2GB            # OS cache estimate (container-aware)
work_mem = 4MB                        # per-operation sort/hash memory
maintenance_work_mem = 256MB          # VACUUM, CREATE INDEX
wal_buffers = 16MB                    # WAL write buffer

# ─── WAL & Checkpoints ──────────────────────────────────────────────────────
checkpoint_completion_target = 0.9    # spread checkpoint I/O
min_wal_size = 256MB
max_wal_size = 1GB

# ─── Query Planner ───────────────────────────────────────────────────────────
random_page_cost = 1.1                # SSD-optimized (default 4.0 is for HDD)
effective_io_concurrency = 200        # SSD parallel I/O

# ─── Logging ─────────────────────────────────────────────────────────────────
log_min_duration_statement = 500      # log queries > 500ms
log_line_prefix = '%t [%p] %d '       # timestamp, pid, database
log_statement = 'none'                # don't log all statements (perf)

# ─── Locale ──────────────────────────────────────────────────────────────────
timezone = 'UTC'
